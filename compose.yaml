services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE : credarc
    ports:
      - 3307:3306

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_PASSWORD}" ]
      interval: 10s
      timeout: 5s
      retries: 5


  app:
    build: .
    ports:
      - 8080:8080
    environment:
      DB_PASSWORD : ${DB_PASSWORD}
      JWT_SECRET : ${JWT_SECRET}
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      mysql:
          condition: service_healthy



volumes:
  mysql_data:
    name: credarc_mysql_data



